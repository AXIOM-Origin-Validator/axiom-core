# ============================================================================
# AXIOM Genesis Ceremony Configuration
# ============================================================================
#
# Paths are relative to where the ceremony tool runs from (src/ workspace root).
# install_genesis.sh handles running from the correct directory.
#
# wallet_email: Genesis wallet address uses this email.
#   Format: "alpha@trustmesh.org" → wallet_id = "alpha@trustmesh.org/hex8"
#   ⚠ RE-DOMAINED 2026-09-20 (the owner): dev/real class isolation makes @axiom a DEV
#   label, so validators (and Nabla nodes) MUST use REAL domains — validators are
#   real accounts, there is no dev VBC/NBC (AXIOM_DESIGN_FactClassIsolation.md
#   preamble point 0). These moved validator_<name>@axiom / nabla_<name>@axiom →
#   <name>@trustmesh.org (one real email per operator; stake + operational share
#   it, differing only by pk_bind hex — the operator's own choice). This is a
#   FRESH-GENESIS re-domaining: editing wallet_email is INTENTIONAL here (new ids
#   + fresh keys + re-issued VBCs via the ceremony). Third-party operators use
#   their own real email (gmail/yahoo/custom).
#
# operational_email (added 2026-09-09): the REAL mail account this validator
#   operates from — the `<Short>_Operational` wallet's address and the account
#   ANTIE's carriers log into.
#   ⚠ wallet_email is ID-BOUND under a LIVE network: never edit it there — the
#   genesis stake wallet ids and Core's compiled list derive from it. It is
#   edited ONLY as part of a fresh-genesis re-domaining (as on 2026-09-20).
#
# wallet_id + stake_key_path (added 2026-09-20, the owner): genesis is NOT the public
#   join path — the OPERATOR creates the stake wallet and the ceremony IMPORTS it
#   (a validator never mints its own wallet). For the REAL ceremony, fill BOTH per
#   validator:
#     wallet_id      = the exact stake wallet_id you created, e.g.
#                      "alpha@trustmesh.org/27dbb7d0ba". It is verified for its
#                      key+email binding (email == wallet_email; trailing salt ==
#                      BLAKE3(pk)[..2] of the imported key — the tool refuses a
#                      mismatch). ⚠ It is NOT the id that bakes: the leading 8 hex
#                      (checksum + pk_bind) are keyed by WALLET_IDENTITY_KEY, which
#                      the ceremony mints AFTER you created the wallet, so the
#                      network's own id is DERIVED under the new key and PRINTED at
#                      the ceremony ("operator id … → baked id …"). Record the
#                      printed id (2026-09-25 finding, AXIOM_OPS_GenesisReDomaining §5).
#     stake_key_path = path to that wallet's Ed25519 PRIVATE key to import
#                      (raw 32 bytes, i.e. a config/ed25519.key file, or 64-hex).
#   REHEARSAL (g1-full-ceremony.sh --rehearsal): leave BOTH out and the tool mints
#   a fresh key + derives the id on the spot. Setting one without the other is an
#   error. So: the entries below (no wallet_id/stake_key_path) rehearse fine as-is;
#   before the REAL run, add both lines to all 10 validators.

[ceremony]
vbc_version = 9
output_dir = "genesis-output"
root_keys_dir = "root-keys"
expires_years = 10
# Path to Core's genesis.rs for auto-install of constants
# Relative to where the ceremony runs (src/ workspace root)
core_genesis_path = "core/logic/src/genesis.rs"

[certificate_authority]
name = "AXIOM Origin"
pgp_fingerprint = "4A189E40F20F5A34B7D69F19D596AB0993DFF9D2"

[[validators]]
name = "axiom-first-penguin-alpha"
path = "genesis-validators/axiom-first-penguin-alpha"
wallet_email = "alpha@trustmesh.org"
operational_email = "alpha@trustmesh.org"
pgp_fingerprint = "4A189E40F20F5A34B7D69F19D596AB0993DFF9D2"
notes = "Genesis Validator - Alpha"
# REAL ceremony — uncomment and fill (you create the wallet; ceremony imports it;
# the id the network derives is printed at the ceremony — see the header):
# wallet_id = "alpha@trustmesh.org/<hex10>"
# stake_key_path = "genesis-validators/axiom-first-penguin-alpha/config/ed25519.key"

